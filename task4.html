<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Registration (Form Elements Example)</h1><br>
    <h2>Personal Information</h2>

    <form>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="pass">Password:</label>
        <input type="password" id="pass" name="pass" required><br><br>

        <label for="date">Date Of Birth:</label>
        <input type="date" id="date" name="date" required><br><br>

        <label for="gender">Gender:</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label><br>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label><br><br>

        <h4>Location</h4>
        <label for="country">Select Country:</label>
        <select id="country" name="country">
            <option value="india">India</option>
            <option value="australia">Australia</option>
            <option value="usa">USA</option>
            <option value="japan">Japan</option>
        </select><br><br>

        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="50"></textarea><br><br>

        <h4>Preferences</h4>
        <input type="checkbox" id="sports" name="preferences" value="Sports">
        <label for="sports">Sports</label><br>
        <input type="checkbox" id="music" name="preferences" value="Music">
        <label for="music">Music</label><br>
        <input type="checkbox" id="reading" name="preferences" value="Reading">
        <label for="reading">Reading</label><br>
        <input type="checkbox" id="traveling" name="preferences" value="Travel">
        <label for="traveling">Travel</label><br><br>

        <label for="experience">Experience Level (1-100):</label><br>
        <input type="range" id="experience" name="experience" min="1" max="100"><br><br>

        <label for="photo">Upload Photo:</label>
        <input type="file" id="photo" name="photo"><br><br>

        <input type="submit" value="Submit">
    </form>

</body>
</html>
